<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Textos para tu web que venden</title>
  <desc id="desc">Ventana editorial con texto resaltado, anotaciones y tarjeta antes después.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0D17"/><stop offset="1" stop-color="#131829"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#3D5AFE" stop-opacity=".25"/><stop offset="1" stop-color="#5B72FF" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#3D5AFE" stop-opacity=".32"/><stop offset="1" stop-color="#3D5AFE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#28304C" stroke-opacity=".36"/></pattern>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="175%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#02030A" flood-opacity=".75"/><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3D5AFE" flood-opacity=".17"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/><path d="M548 630 1200 38 1200 303Z" fill="url(#beam)"/><ellipse cx="867" cy="308" rx="314" ry="243" fill="url(#halo)"/><path d="M0 542H1200" stroke="#28304C"/>
  <!-- browser sheet -->
  <g transform="translate(648 132) skewY(-3)" filter="url(#shadow)">
    <rect width="456" height="294" rx="16" fill="#12182A" stroke="#5B72FF" stroke-opacity=".65"/>
    <path d="M0 48H456" stroke="#28304C"/><circle cx="25" cy="24" r="5" fill="#5B72FF"/><circle cx="43" cy="24" r="5" fill="#5A6484"/><circle cx="61" cy="24" r="5" fill="#5A6484"/><rect x="91" y="16" width="224" height="16" rx="8" fill="#1D2744"/><text x="109" y="28" font-family="Consolas, 'Courier New', monospace" font-size="10" fill="#9AA2BC">tusitio.cl/servicios</text>
    <text x="31" y="93" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.5" fill="#7E90FF">TÚ NECESITAS</text>
    <rect x="27" y="109" width="359" height="43" rx="5" fill="#3D5AFE" opacity=".2"/>
    <text x="31" y="142" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="-1.25" fill="#EAEDF6">Una web que explica y convierte</text>
    <path d="M31 158c75 8 197-4 360 0" fill="none" stroke="#5B72FF" stroke-width="5" stroke-linecap="round"/>
    <text x="31" y="190" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#9AA2BC">Sin frases vacías. Con razones para elegirte.</text>
    <rect x="31" y="218" width="135" height="39" rx="19.5" fill="#3D5AFE"/><text x="54" y="243" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">Conversemos</text>
    <path d="M170 229c56-9 87-4 114 2" fill="none" stroke="#5A6484" stroke-width="5" stroke-linecap="round"/><path d="M170 246h175" stroke="#28304C" stroke-width="5" stroke-linecap="round"/>
    <rect x="392" y="112" width="4" height="35" rx="2" fill="#7E90FF"/>
  </g>
  <!-- editorial annotations -->
  <g fill="none" stroke="#7E90FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M624 217c-31 4-41 22-43 46m0 0-8-10m8 10 9-10"/>
    <path d="M987 391c23 4 40-2 49-18m0 0-12 5m12-5-3 12"/>
    <ellipse cx="757" cy="366" rx="84" ry="33" transform="rotate(-5 757 366)"/>
    <path d="M1052 176c27-25 53-17 59-2 4 11-8 18-23 14"/>
