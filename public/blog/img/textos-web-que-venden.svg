  <text x="72" y="370" fill="#9AA2BC" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" letter-spacing="-.6">Cómo escribir tu página para que te elijan</text>
  <text x="72" y="588" fill="#EAEDF6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="-1.5">Faro<tspan fill="#5B72FF">°</tspan></text><text x="1128" y="588" text-anchor="end" fill="#5A6484" font-family="Consolas, 'Courier New', monospace" font-size="14">Por Clementina Moya · faroagencia.cl</text>
