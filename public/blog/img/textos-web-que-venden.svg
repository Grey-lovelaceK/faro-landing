  <g font-family="Consolas, 'Courier New', monospace"><rect x="72" y="66" width="151" height="36" rx="18" fill="#11172A" stroke="#5B72FF"/><text x="92" y="89" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7E90FF">COPYWRITING</text></g>
