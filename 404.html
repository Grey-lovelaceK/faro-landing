<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Faro°</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔦</text></svg>">
<style>
  :root{--accent:#3D5AFE;--ground:#EEF1F7;--ink:#111420;--muted:#59617A;--border:#D5DBE8;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#5B72FF;--ground:#0A0D17;--ink:#EAEDF6;--muted:#9AA2BC;--border:#28304C}}
  :root[data-theme="dark"]{--accent:#5B72FF;--ground:#0A0D17;--ink:#EAEDF6;--muted:#9AA2BC;--border:#28304C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font-family:var(--sans);padding:24px 16px;position:relative;overflow-x:hidden}
  body::before{content:"";position:absolute;top:-20%;right:-10%;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 62%);opacity:.14;pointer-events:none}
  main{position:relative;max-width:520px;text-align:center}
  .code{font-family:var(--mono);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:14px 0 12px;text-wrap:balance}
  p{color:var(--muted);margin:0 0 28px;line-height:1.6}
  .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a{display:inline-flex;padding:11px 20px;border-radius:999px;font-weight:600;font-size:.94rem;text-decoration:none;border:1px solid var(--border);color:var(--ink)}
  a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <main>
    <span class="code">// 404 · fuera del haz</span>
    <h1>Esta página no existe.</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <div class="links">
      <a href="/" class="primary">Ir al inicio</a>
      <a href="/analiza">Analiza tu web</a>
      <a href="/integraciones">Integraciones</a>
    </div>
  </main>
</body>
</html>
